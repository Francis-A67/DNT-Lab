topology:
  networks:
  - name: link-h1
  - name: net1A
  - name: net1B
  - name: net1C
  - name: net2A
  - name: net2B
  - name: net2C
  - name: link-h2

  nodes:
  - name: h1
    cmd: |
      ip addr add 10.0.0.1/24 dev eth0
      ip link set eth0 up
      ethtool -K eth0 rxvlan off txvlan off tx off rx off
      bash
    connections:
    - to: link-h1

  - name: bridgeA
    cmd: |
      sysctl -w net.ipv4.ip_forward=1
      ip link set eth0 up
      ip link set eth1 mtu 1600 up
      ip link set eth2 mtu 1600 up
      ip addr add 10.1.1.1/30 dev eth1
      ip addr add 10.2.1.1/30 dev eth2
      FRRBIN=/usr/lib/frr; [ -x $FRRBIN/zebra ] || FRRBIN=/usr/local/sbin
      mkdir -p /etc/frr/bridgeA /var/run/frr/bridgeA
      cp /home/francis/lab/ospf-topo/bridgeA.conf /etc/frr/bridgeA/frr.conf
      : > /etc/frr/bridgeA/vtysh.conf
      chown -R frr:frr /etc/frr/bridgeA /var/run/frr/bridgeA
      $FRRBIN/zebra -N bridgeA -d -f /etc/frr/bridgeA/frr.conf
      sleep 1
      $FRRBIN/ospfd -N bridgeA -d -f /etc/frr/bridgeA/frr.conf
      bash
    connections:
    - to: link-h1
    - to: net1A
    - to: net2A

  - name: bridge1A
    cmd: |
      sysctl -w net.ipv4.ip_forward=1
      ip link set eth0 mtu 1600 up
      ip link set eth1 mtu 1600 up
      ip addr add 10.1.1.2/30 dev eth0
      ip addr add 10.1.2.1/30 dev eth1
      FRRBIN=/usr/lib/frr; [ -x $FRRBIN/zebra ] || FRRBIN=/usr/local/sbin
      mkdir -p /etc/frr/bridge1A /var/run/frr/bridge1A
      cp /home/francis/lab/ospf-topo/bridge1A.conf /etc/frr/bridge1A/frr.conf
      : > /etc/frr/bridge1A/vtysh.conf
      chown -R frr:frr /etc/frr/bridge1A /var/run/frr/bridge1A
      $FRRBIN/zebra -N bridge1A -d -f /etc/frr/bridge1A/frr.conf
      sleep 1
      $FRRBIN/ospfd -N bridge1A -d -f /etc/frr/bridge1A/frr.conf
      bash
    connections:
    - to: net1A
    - to: net1B

  - name: bridge1B
    cmd: |
      sysctl -w net.ipv4.ip_forward=1
      ip link set eth0 mtu 1600 up
      ip link set eth1 mtu 1600 up
      ip addr add 10.1.2.2/30 dev eth0
      ip addr add 10.1.3.1/30 dev eth1
      FRRBIN=/usr/lib/frr; [ -x $FRRBIN/zebra ] || FRRBIN=/usr/local/sbin
      mkdir -p /etc/frr/bridge1B /var/run/frr/bridge1B
      cp /home/francis/lab/ospf-topo/bridge1B.conf /etc/frr/bridge1B/frr.conf
      : > /etc/frr/bridge1B/vtysh.conf
      chown -R frr:frr /etc/frr/bridge1B /var/run/frr/bridge1B
      $FRRBIN/zebra -N bridge1B -d -f /etc/frr/bridge1B/frr.conf
      sleep 1
      $FRRBIN/ospfd -N bridge1B -d -f /etc/frr/bridge1B/frr.conf
      bash
    connections:
    - to: net1B
    - to: net1C

  - name: bridge2A
    cmd: |
      sysctl -w net.ipv4.ip_forward=1
      ip link set eth0 mtu 1600 up
      ip link set eth1 mtu 1600 up
      ip addr add 10.2.1.2/30 dev eth0
      ip addr add 10.2.2.1/30 dev eth1
      FRRBIN=/usr/lib/frr; [ -x $FRRBIN/zebra ] || FRRBIN=/usr/local/sbin
      mkdir -p /etc/frr/bridge2A /var/run/frr/bridge2A
      cp /home/francis/lab/ospf-topo/bridge2A.conf /etc/frr/bridge2A/frr.conf
      : > /etc/frr/bridge2A/vtysh.conf
      chown -R frr:frr /etc/frr/bridge2A /var/run/frr/bridge2A
      $FRRBIN/zebra -N bridge2A -d -f /etc/frr/bridge2A/frr.conf
      sleep 1
      $FRRBIN/ospfd -N bridge2A -d -f /etc/frr/bridge2A/frr.conf
      bash
    connections:
    - to: net2A
    - to: net2B

  - name: bridge2B
    cmd: |
      sysctl -w net.ipv4.ip_forward=1
      ip link set eth0 mtu 1600 up
      ip link set eth1 mtu 1600 up
      ip addr add 10.2.2.2/30 dev eth0
      ip addr add 10.2.3.1/30 dev eth1
      FRRBIN=/usr/lib/frr; [ -x $FRRBIN/zebra ] || FRRBIN=/usr/local/sbin
      mkdir -p /etc/frr/bridge2B /var/run/frr/bridge2B
      cp /home/francis/lab/ospf-topo/bridge2B.conf /etc/frr/bridge2B/frr.conf
      : > /etc/frr/bridge2B/vtysh.conf
      chown -R frr:frr /etc/frr/bridge2B /var/run/frr/bridge2B
      $FRRBIN/zebra -N bridge2B -d -f /etc/frr/bridge2B/frr.conf
      sleep 1
      $FRRBIN/ospfd -N bridge2B -d -f /etc/frr/bridge2B/frr.conf
      bash
    connections:
    - to: net2B
    - to: net2C

  - name: bridgeB
    cmd: |
      sysctl -w net.ipv4.ip_forward=1
      ip link set eth0 up
      ip link set eth1 mtu 1600 up
      ip link set eth2 mtu 1600 up
      ip addr add 10.1.3.2/30 dev eth1
      ip addr add 10.2.3.2/30 dev eth2
      FRRBIN=/usr/lib/frr; [ -x $FRRBIN/zebra ] || FRRBIN=/usr/local/sbin
      mkdir -p /etc/frr/bridgeB /var/run/frr/bridgeB
      cp /home/francis/lab/ospf-topo/bridgeB.conf /etc/frr/bridgeB/frr.conf
      : > /etc/frr/bridgeB/vtysh.conf
      chown -R frr:frr /etc/frr/bridgeB /var/run/frr/bridgeB
      $FRRBIN/zebra -N bridgeB -d -f /etc/frr/bridgeB/frr.conf
      sleep 1
      $FRRBIN/ospfd -N bridgeB -d -f /etc/frr/bridgeB/frr.conf
      bash
    connections:
    - to: link-h2
    - to: net1C
    - to: net2C

  - name: h2
    cmd: |
      ip addr add 10.0.0.2/24 dev eth0
      ip link set eth0 up
      ethtool -K eth0 rxvlan off txvlan off tx off rx off
      bash
    connections:
    - to: link-h2
